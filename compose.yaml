services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aridlink
      POSTGRES_USER: aridlink
      POSTGRES_PASSWORD: aridlink
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aridlink -d aridlink"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - aridlink-postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      ARIDLINK_DATABASE_URL: postgres://aridlink:aridlink@postgres:5432/aridlink?sslmode=disable
      ARIDLINK_BOOTSTRAP_EMAIL: admin@aridlink.local
      ARIDLINK_BOOTSTRAP_PASSWORD: change-me-now
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12

volumes:
  aridlink-postgres:
